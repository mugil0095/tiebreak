# All five Gemini Flash models plus a scikit-learn baseline. The three non-Lite models allow only 20 requests per day on the free tier,
# so this file needs a paid key. Free-tier users: use models.yaml. Set your own key first: PowerShell  $env:GEMINI_API_KEY = "..."
# Free tiers allow few requests per minute and per day, so calls are paced; a model that runs out of quota is left out with a warning.
- {name: logreg, kind: ml, estimator: logistic_regression}
- {name: flash-lite-3.1, kind: llm, provider: gemini, model: "gemini-3.1-flash-lite", api_key_env: GEMINI_API_KEY, requests_per_minute: 12, params: {max_tokens: 512}}
- {name: flash-lite-3.5, kind: llm, provider: gemini, model: "gemini-3.5-flash-lite", api_key_env: GEMINI_API_KEY, requests_per_minute: 12, params: {max_tokens: 256}}
- {name: flash-3-preview, kind: llm, provider: gemini, model: "gemini-3-flash-preview", api_key_env: GEMINI_API_KEY, requests_per_minute: 4, params: {max_tokens: 1024}}
- {name: flash-3.6, kind: llm, provider: gemini, model: "gemini-3.6-flash", api_key_env: GEMINI_API_KEY, requests_per_minute: 4, params: {max_tokens: 1024}}
- {name: flash-3.8, kind: llm, provider: gemini, model: "gemini-3.8-flash", api_key_env: GEMINI_API_KEY, requests_per_minute: 4, params: {max_tokens: 1024}}
