[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiebreak"
version = "0.2.0"
description = "Pick the cheapest model that is statistically tied with the best, on your own data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3",
  "pydantic>=2.5", "pyyaml>=6.0", "typer>=0.12", "jinja2>=3.1",
]

[project.optional-dependencies]
llm = ["litellm>=1.40", "httpx>=0.25"]
boost = ["xgboost>=2.0", "lightgbm>=4.0"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.25", "ruff>=0.4"]

[project.scripts]
tiebreak = "tiebreak.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tiebreak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: reserved for future tests that need real provider keys (none exist yet)",
  "slow: statistical simulations",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F"]  # pyflakes only: unused imports/variables, undefined names
